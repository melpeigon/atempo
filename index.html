<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atempo - Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/inicio.css" />
  <link rel="stylesheet" href="css/fichas.css" />
  <link rel="stylesheet" href="css/formularios.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <main class="app-shell" id="pantalla-inicio">
    <header class="logo">
      <img src="Branding/logos/SVG/logo%20oscuro.svg" alt="Atempo" />
    </header>

    <section class="bienvenida" aria-labelledby="bienvenida-titulo">
      <h1 id="bienvenida-titulo">Buenos días.</h1>
      <p>Vamos a por el día, a tu ritmo.</p>
      <time id="fecha-hoy"></time>
    </section>

    <section class="agenda" aria-labelledby="agenda-titulo">
      <h2 id="agenda-titulo">Vuestra agenda</h2>
      <div id="estado-sin-personas">
        <button class="boton-primera-persona" id="boton-primera-persona" type="button">
          <span class="icono-redondo" aria-hidden="true">+</span>
          <span class="mensaje-vacio">
            Empieza añadiendo<br />a la primera persona.
          </span>
        </button>
      </div>

      <div class="personas-agenda">
        <div class="lista-personas" id="lista-personas"></div>

        <button class="boton-anadir-otra-persona" id="boton-anadir-otra-persona" type="button" hidden>
          <span class="icono-redondo" aria-hidden="true">+</span>
          <span>Añadir<br />persona</span>
        </button>
      </div>
    </section>

    <!-- AGENDA - PLANES HOY -->
    <section class="planes-hoy" aria-labelledby="titulo-planes-hoy">
      <div class="cabecera-planes-hoy">
        <h2 id="titulo-planes-hoy">Hoy</h2>
        <span class="num-planes-hoy" id="numero-planes-hoy">0 Planes</span>
      </div>
      <p class="mensaje-sin-planes mensaje-vacio" id="mensaje-sin-planes">Todavía no hay planes. Cuando añadas una
        actividad, aparecerá aquí.</p>
      <div class="lista-actividades-hoy" id="lista-actividades-hoy"></div>

    </section>

    <footer class="actions" aria-label="Acciones principales">
      <button class="button button-primary" id="boton-anadir-actividad" type="button">
        <span aria-hidden="true">+</span> Añadir actividad
      </button>
      <button class="button" type="button" data-action="open-calendar">Ver calendario</button>
    </footer>
  </main>

  <!-- FICHA PERSONA -->

  <section class="ficha-persona app-shell" id="ficha-persona" aria-labelledby="titulo-ficha-persona" hidden>
    <button class="boton-volver" id="boton-volver-inicio" type="button">
      ← Volver
    </button>

    <h1 id="titulo-ficha-persona">Ficha de persona</h1>

    <div id="contenido-ficha-persona"></div>
    <div class="botones-ficha-persona">
      <button class="boton-editar-persona" id="boton-editar-persona" type="button">
        Editar persona
      </button>

      <button class="boton-eliminar-persona" id="boton-eliminar-persona" type="button">
        Eliminar persona
      </button>
    </div>
  </section>

  <!-- FICHA ACTIVIDAD -->

  <section class="ficha-actividad app-shell" id="ficha-actividad" aria-labelledby="titulo-ficha-actividad" hidden>
    <button class="boton-volver" id="boton-volver-actividad" type="button">
      ← Volver
    </button>

    <h1 id="titulo-ficha-actividad">Ficha de actividad</h1>

    <div id="contenido-ficha-actividad"></div>

    <div class="botones-ficha-actividad">
      <button class="boton-editar-actividad" id="boton-editar-actividad" type="button">
        Editar actividad
      </button>

      <button class="boton-eliminar-actividad" id="boton-eliminar-actividad" type="button">
        Eliminar actividad
      </button>
    </div>
  </section>

  <!-- FORMULARIO NUEVA PERSONA -->
  <dialog class="emergente-nueva-persona" id="emergente-nueva-persona" aria-labelledby="titulo-emergente-nueva-persona">
    <h2 id="titulo-emergente-nueva-persona">Añade una nueva persona</h2>

    <form class="introducir-datos-persona" id="formulario-nueva-persona">

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="color">Color</label>
      <select id="color" name="color" required>
        <option value="#c6afd0">Lila</option>
        <option value="#f2beba">Melocotón</option>
        <option value="#ffeccc">Amarillo</option>
        <option value="#e0dcd6">Gris</option>
        <option value="#B0C5D4">Azul</option>
        <option value="#AEC2B3">Verde</option>
      </select>

      <label for="icono">Icono</label>
      <select id="icono" name="icono" required>
        <option value="" selected disabled>Elige un icono</option>
        <option value="mujer">Mujer</option>
        <option value="nino">Niño</option>
        <option value="bebe">Bebé</option>
        <option value="hombre">Hombre</option>
      </select>

      <button type="submit" id="boton-guardar-persona">Guardar</button>
    </form>

    <button class="boton-cerrar-emergente" id="boton-cerrar-emergente" type="button">
      Cerrar
    </button>
  </dialog>


  <!-- FORMULARIO EMERGENTE AÑADIR ACTIVIDAD -->

  <dialog class="emergente-nueva-actividad" id="emergente-nueva-actividad"
    aria-labelledby="titulo-emergente-nueva-actividad">
    <h2 id="titulo-emergente-nueva-actividad">
      Añade una actividad
    </h2>

    <form class="form-anadir-actividad" id="form-anadir-actividad">

      <label for="elige-persona">Elige persona </label>
      <select id="elige-persona" name="persona" required>
        <option value="" selected disabled>Elige una persona</option>

      </select>

      <label for="elige-actividad">Actividad </label>
      <select id="elige-actividad" name="actividad" required>
        <option value="" selected disabled>Elige una actividad</option>
        <option value="musica">Música</option>
        <option value="catequesis">Catequesis</option>
        <option value="futbol">Fútbol</option>
        <option value="cumple">Cumpleaños</option>
        <option value="peluqueria">Peluquería</option>
        <option value="dentista">Dentista</option>
        <option value="ingles">Inglés</option>
        <option value="padel">Pádel</option>
        <option value="gym">Gym</option>
      </select>

      <label for="elige-fecha">Fecha inicio</label>
      <input type="date" id="elige-fecha" name="fecha" required />

      <label for="elige-recurrencia">Recurrencia</label>
      <select id="elige-recurrencia" name="recurrencia" required>
        <option value="puntual">Puntual</option>
        <option value="semanal">Semanal</option>
        <option value="mensual">Mensual</option>
      </select>

      <div class="opciones-semanales" id="opciones-semanales" hidden>
        <p class="ayuda-formulario">
          Selecciona varios días sólo si coinciden en la misma hora.
        </p>

        <div class="dias-container" id="dias-container">
          <label><input type="checkbox" name="dias" value="lunes" /> Lunes</label>
          <label><input type="checkbox" name="dias" value="martes" /> Martes</label>
          <label><input type="checkbox" name="dias" value="miercoles" /> Miércoles</label>
          <label><input type="checkbox" name="dias" value="jueves" /> Jueves</label>
          <label><input type="checkbox" name="dias" value="viernes" /> Viernes</label>
          <label><input type="checkbox" name="dias" value="sabado" /> Sábado</label>
          <label><input type="checkbox" name="dias" value="domingo" /> Domingo</label>
        </div>
      </div>
      <label for="elige-hora">Hora</label>
      <input type="time" id="elige-hora" name="hora" required />

      <label for="introduce-anotacion">Escribe tu recordatorio </label>
      <input type="text" id="introduce-anotacion" name="recordatorio" />

      <p class="mensaje-error-formulario" id="mensaje-error-actividad" role="alert" hidden></p>

      <button type="submit" id="boton-guardar-actividad">Guardar</button>
    </form>

    <button class="boton-cerrar-emergente" id="boton-cerrar-actividad" type="button">
      Cerrar
    </button>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/actividades.js"></script>
  <script src="js/formulario-actividades.js"></script>
</body>

</html>
